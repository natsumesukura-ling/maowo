<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>房间 · 白天发言</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#B4532F}a:hover{color:#8F3F22}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAF9F5; color: #141413; font-family: -apple-system, 'PingFang SC', 'Noto Sans SC', sans-serif; display: flex; flex-direction: column; overflow: hidden;">

  <header style="display: flex; align-items: center; gap: 10px; padding: 14px 16px 10px;">
    <button aria-label="返回大厅" style="width: 44px; height: 44px; border: none; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #141413;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </button>
    <div style="flex-grow: 1; min-width: 0;">
      <div style="font-family: 'Noto Serif SC', serif; font-size: 18px; font-weight: 600;">周五晚上的局</div>
      <div style="font-size: 12px; color: #5E5D59; margin-top: 2px;">9 人局 · 3 狼 3 民 · 预言家 女巫 猎人</div>
    </div>
    <div style="font-size: 12px; padding: 6px 10px; border-radius: 999px; background: #F0EEE6; color: #3D3D3A; white-space: nowrap;">第 2 天 · 发言</div>
  </header>

  <div style="margin: 0 16px; padding: 10px 12px 10px 14px; border-radius: 12px; background: #F0EEE6; display: flex; align-items: center; gap: 10px;">
    <div style="flex-grow: 1; font-size: 13px; line-height: 1.5;">
      <div><span style="font-weight: 600;">4号 青柠</span> 发言中</div>
      <div style="color: #5E5D59; font-size: 12px;">已静默 3:12</div>
    </div>
    <button style="height: 36px; padding: 0 14px; border-radius: 10px; border: 1px solid #D1CFC5; background: #FFFFFF; color: #141413; font-size: 13px;">跳过</button>
  </div>

  <div style="padding: 14px 16px 6px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px 4px;">
    <sc-for list="{{seats}}" as="s" hint-placeholder-count="9">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px; {{s.cellCss}}">
        <div style="position: relative; width: 44px; height: 44px;">
          <div style="width: 44px; height: 44px; box-sizing: border-box; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 16px; {{s.avatarCss}}">{{s.initial}}</div>
          <div style="position: absolute; left: -4px; top: -4px; min-width: 18px; height: 18px; padding: 0 4px; box-sizing: border-box; border-radius: 9px; background: #FAF9F5; border: 1px solid #D1CFC5; font-size: 11px; line-height: 16px; text-align: center; color: #3D3D3A;">{{s.seat}}</div>
          <sc-if value="{{s.sheriff}}" hint-placeholder-val="{{false}}">
            <div style="position: absolute; right: -6px; bottom: -2px; height: 18px; padding: 0 4px; border-radius: 9px; background: #B4532F; color: #FFFFFF; font-size: 10px; line-height: 18px;">警</div>
          </sc-if>
        </div>
        <div style="font-size: 12px; max-width: 64px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; {{s.nameCss}}">{{s.name}}</div>
        <div style="font-size: 10px; color: #5E5D59; height: 13px;">{{s.note}}</div>
      </div>
    </sc-for>
  </div>

  <button style="margin: 4px 16px 0; height: 44px; border-radius: 12px; border: 1px dashed #D1CFC5; background: transparent; display: flex; align-items: center; justify-content: center; gap: 8px; color: #3D3D3A; font-size: 13px;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg>
    你的身份已盖住，点一下查看
  </button>

  <div style="flex-grow: 1; overflow: hidden; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px;">
    <div style="text-align: center; font-size: 12px; color: #5E5D59;">第 2 夜 · 天黑请闭眼</div>
    <div style="text-align: center; font-size: 12px; color: #5E5D59;">天亮了。昨夜是平安夜</div>
    <div style="text-align: center; font-size: 12px; color: #5E5D59;">警长 1号 夜声 选择顺时针，从 3号 开始发言</div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; color: #5E5D59;"><span style="color: #141413; font-weight: 600;">3号 临川</span> · 发言</div>
      <div style="background: #F0EEE6; border-radius: 14px; padding: 10px 14px; font-size: 14px; line-height: 1.65;">昨晚平安夜，说明女巫大概率开了解药。我先不站边，2号走得太早，他的发言没留下可以核的东西。今天我想先听 6号 解释一下昨天为什么改票。</div>
    </div>
    <div style="text-align: center; font-size: 12px; color: #5E5D59;">轮到 4号 青柠 发言</div>
  </div>

  <div style="padding: 10px 16px 18px;">
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; border-radius: 22px; background: #FFFFFF; border: 1px solid #E8E6DC;">
      <div style="flex-grow: 1; font-size: 14px; color: #5E5D59;">还没轮到你，4号之后就是你</div>
      <button aria-label="发送" disabled style="width: 40px; height: 40px; border-radius: 50%; border: none; background: #E8E6DC; color: #FFFFFF; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"></path></svg>
      </button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      { seat: 1, name: '夜声', sheriff: true, note: '' },
      { seat: 2, name: '晚星', dead: true, note: '出局' },
      { seat: 3, name: '临川', note: '已发言' },
      { seat: 4, name: '青柠', speaking: true, note: '发言中' },
      { seat: 5, name: '绫子', me: true, note: '你' },
      { seat: 6, name: '夏目凌', note: '' },
      { seat: 7, name: '白露', note: '' },
      { seat: 8, name: '秋水', dead: true, note: '出局' },
      { seat: 9, name: '南风', note: '' },
    ];
    const seats = raw.map((s) => ({
      ...s,
      sheriff: !!s.sheriff,
      initial: s.name.slice(0, 1),
      cellCss: s.dead ? 'opacity: 0.4;' : '',
      avatarCss: s.speaking
        ? 'background: #FFFFFF; border: 2px solid #D97757; color: #141413;'
        : s.me
          ? 'background: #141413; border: none; color: #FAF9F5;'
          : 'background: #F0EEE6; border: 1px solid #E8E6DC; color: #3D3D3A;',
      nameCss: s.dead ? 'text-decoration: line-through; color: #5E5D59;' : 'color: #141413;',
    }));
    return { seats };
  }
}
</script>
</body>
</html>
