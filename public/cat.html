<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F7EEE1">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>猫们 · 猫窝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<style>
  /* ---------- the window ---------- */
  body.chat { overflow: hidden; }
  /* Pinned to the screen edges, not 100vh/100dvh: on some phones those come out taller than the screen
     and push the input box off the bottom (绫 saw no input box). The room page pins its bar the same way. */
  body.chat #app { position: fixed; inset: 0; display: flex; flex-direction: column; }
  .top { padding: 0 12px 0 8px; border-bottom: 1px solid var(--border); background: var(--bg); flex-shrink: 0; }
  .top header { display: flex; align-items: center; gap: 2px; padding: 8px 0; max-width: 560px; margin: 0 auto; }
  .top .who { display: flex; align-items: center; gap: 10px; min-width: 0; flex-grow: 1; padding-left: 2px; }
  .top .who > div { min-width: 0; }
  .top .avatar { width: 38px; height: 38px; font-size: 15px; }
  .top .n { font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top .m { font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 5px; white-space: nowrap; overflow: hidden; }
  .top .m span:last-child { overflow: hidden; text-overflow: ellipsis; }
  .icon-btn.on { background: var(--accent-soft); color: var(--accent); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok-text); flex-shrink: 0; }
  .dot.sleep { background: var(--line); } .dot.play, .dot.busy { background: var(--accent-line); }
  .dot.busy { animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  #feed { flex: 1 1 auto; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  #feed .in { max-width: 560px; margin: 0 auto; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 10px; }
  .stamp { align-self: center; font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  .b { max-width: 82%; padding: 10px 13px; border-radius: 18px; font-size: 14.5px; line-height: 1.65; white-space: pre-wrap; word-break: break-word; }
  .b.say { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 6px; }
  .b.me { align-self: flex-end; background: var(--accent-soft); border-bottom-right-radius: 6px; }
  .act { align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); padding: 5px 10px; border-radius: 10px; background: var(--white); border: 1px dashed var(--border); max-width: 88%; font-family: inherit; text-align: left; cursor: pointer; line-height: 1.5; }
  .act svg { flex-shrink: 0; }
  .act.bad { color: var(--danger); }
  .wakeline { align-self: stretch; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--muted); text-align: center; line-height: 1.5; }
  .wakeline::before, .wakeline::after { content: ''; flex: 1; height: 1px; background: var(--border); min-width: 16px; }
  .wakeline span { max-width: 78%; }
  .foldline { align-self: center; font-size: 12.5px; color: var(--accent); text-decoration: none; padding: 4px 12px; border-radius: 999px; background: var(--white); border: 1px solid var(--border); }
  div.foldline { color: var(--muted); }
  .hiddenline { align-self: stretch; text-align: center; font-size: 12.5px; color: var(--muted); padding: 10px 12px; border-radius: 14px; background: var(--card); border: 1px dashed var(--line); line-height: 1.6; }
  .b.me.order { background: var(--white); border: 1.5px dashed var(--accent-line); color: var(--text2); }
  .b.me .tag, .b.say .tag { display: block; font-size: 11px; font-weight: 600; color: var(--accent); margin-bottom: 2px; }
  .b.ova { box-shadow: inset 3px 0 0 #C9A2D8; }
  [data-mine] { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  .noteline { align-self: center; max-width: 92%; font-size: 12px; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 999px; text-align: center; line-height: 1.5; }
  .noteline.aside { border-style: dashed; }
  .regen { align-self: flex-start; display: flex; align-items: center; gap: 5px; font: inherit; font-size: 12px; color: var(--muted); background: none; border: none; padding: 0 4px; cursor: pointer; margin-top: -4px; }
  .banner { max-width: 560px; margin: 0 auto 8px; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text2); background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 7px 10px; line-height: 1.5; }
  .banner.ova { background: #F1E6F5; border-color: #DCC6E6; color: #6C4A7C; }
  .banner .btn { margin-left: auto; width: auto; padding: 0 12px; height: 30px; font-size: 12.5px; }
  .banner:empty { display: none; }
  .bottom .dollar { width: 36px; height: 44px; flex-shrink: 0; border: 1px solid var(--line); background: var(--white); color: var(--text2); border-radius: 12px; font: inherit; font-size: 17px; font-weight: 700; cursor: pointer; padding: 0; }
  .bottom .dollar.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-hover); }
  .icon-btn.ova-on { background: #F1E6F5; color: #7D4F92; }
  .err { align-self: center; max-width: 92%; font-size: 12.5px; color: var(--danger); background: var(--secret-bg); padding: 8px 12px; border-radius: 12px; line-height: 1.6; text-align: center; }
  .typing { align-self: flex-start; font-size: 13px; color: var(--muted); padding: 8px 13px; border-radius: 18px; background: var(--card); border: 1px solid var(--border); }
  .typing i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--muted); margin: 0 1.5px; animation: blink 1.2s infinite; vertical-align: middle; }
  .typing i:nth-child(2) { animation-delay: .2s; } .typing i:nth-child(3) { animation-delay: .4s; }
  .older { align-self: center; }
  .bottom { border-top: 1px solid var(--border); background: var(--bg); flex-shrink: 0; padding: 10px 16px calc(12px + env(safe-area-inset-bottom)); }
  .bottom form { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; align-items: flex-end; }
  .bottom textarea { resize: none; height: 44px; max-height: 132px; line-height: 20px; overflow-y: hidden; scrollbar-width: none; }
  .bottom textarea::-webkit-scrollbar { display: none; }
  .bottom .pic-btn { width: 44px; height: 44px; flex-shrink: 0; border: 1px solid var(--line); background: var(--white); color: var(--text2); border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0; }
  .picks { max-width: 560px; margin: 0 auto 8px; display: flex; gap: 8px; }
  .picks:empty { display: none; }
  .picks .pk { position: relative; width: 60px; height: 60px; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .picks .pk img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .picks .pk button { position: absolute; top: 2px; right: 2px; width: 22px; height: 22px; border-radius: 50%; border: none; background: rgba(42, 31, 23, .7); color: #fff; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer; }
  .mepics { align-self: flex-end; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; max-width: 82%; }
  .mepics button { width: 96px; height: 96px; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); padding: 0; background: var(--card); cursor: pointer; }
  .mepics.one button { width: 180px; height: auto; max-height: 240px; }
  .mepics img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mepics.one img { height: auto; max-height: 240px; }
  .lightbox { position: fixed; inset: 0; z-index: 70; background: rgba(20, 15, 10, .92); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 6px; }
  .bottom .btn { width: 44px; padding: 0; flex-shrink: 0; }
  .newchip { position: fixed; right: 16px; bottom: 84px; z-index: 5; display: none; }
  .detail-pre { white-space: pre-wrap; word-break: break-word; font-size: 12.5px; line-height: 1.6; background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; max-height: 46vh; overflow-y: auto; }
  .nb-line { display: flex; gap: 10px; font-size: 14px; line-height: 1.6; padding: 8px 0; color: var(--text2); }
  .nb-line + .nb-line { border-top: 1px solid #EFE3D2; }
  .nb { background: var(--white); border: 1px solid var(--border); border-radius: 14px; padding: 4px 14px; }
  .sum { font-size: 13px; color: var(--text2); line-height: 1.7; padding: 12px 14px; border-radius: 14px; background: var(--card); border: 1px solid var(--border); white-space: pre-wrap; }

  /* ---------- settings ---------- */
  .lorelink { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); color: var(--text); text-decoration: none; }
  .lorelink svg { flex-shrink: 0; color: var(--text2); } .lorelink svg:last-child { color: var(--accent); }
  .lorelink .t { flex-grow: 1; font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 16px; }
  .lorelink .s { display: block; font-family: var(--font); font-weight: 400; font-size: 12px; color: var(--muted); margin-top: 3px; }
  .lorelink .v { color: var(--muted); font-size: 14px; white-space: nowrap; }
  /* ---------- 世界书 ---------- */
  .lore-tools { display: flex; gap: 8px; margin: 14px 0 10px; } .lore-tools .btn { flex: 1; }
  .lore { width: 100%; display: block; text-align: left; padding: 14px; border-radius: 18px; background: var(--card); border: 1px solid var(--border); margin-bottom: 10px; font: inherit; color: var(--text); cursor: pointer; }
  .lore.off { opacity: .55; }
  .lore .h { display: flex; align-items: center; gap: 8px; }
  .lore .h b { font-family: "Noto Serif SC", serif; font-size: 16px; flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lore .p { font-size: 13px; color: var(--text2); margin-top: 6px; line-height: 1.6; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: pre-wrap; word-break: break-word; }
  .lore .f { font-size: 11.5px; color: var(--muted); margin-top: 6px; }
  .warn { font-size: 12.5px; line-height: 1.6; color: var(--secret-text); background: var(--secret-bg); border-radius: 12px; padding: 8px 12px; margin-bottom: 12px; }
  .modes { display: flex; gap: 8px; } .modes button { flex: 1; padding: 10px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); font: inherit; color: var(--text); cursor: pointer; text-align: left; }
  .modes button b { display: block; font-size: 14px; } .modes button span { font-size: 11.5px; color: var(--muted); line-height: 1.5; }
  .modes button.on { background: var(--accent-soft); border-color: var(--accent-line); } .modes button.on b { color: var(--accent-hover); }
  main.wrap { padding-bottom: 40px; }
  .pic { display: flex; align-items: center; gap: 14px; margin: 6px 0 4px; }
  .pic .avatar { width: 72px; height: 72px; font-size: 28px; border: 3px solid var(--white); box-shadow: 0 0 0 1px var(--border); }
  textarea.big { resize: vertical; min-height: 160px; font-size: 13.5px; line-height: 1.6; }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; line-height: 1.55; }
  .pick { display: flex; gap: 8px; flex-wrap: wrap; }
  .pick button { padding: 8px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); font: inherit; font-size: 13px; color: var(--text); cursor: pointer; }
  .pick button.on { background: var(--accent-soft); border-color: var(--accent-line); color: var(--accent-hover); font-weight: 600; }
  .pick button.add { color: var(--accent); border-style: dashed; }
  .modelbox { flex-grow: 1; min-width: 0; min-height: 44px; display: flex; align-items: center; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--white); font-size: 14px; word-break: break-all; }
  .modelbox.empty-m { color: var(--muted); font-family: inherit; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 12px 0; border-top: 1px solid var(--border); font-size: 14px; width: 100%; background: none; border-left: none; border-right: none; border-bottom: none; font-family: inherit; color: var(--text); text-align: left; cursor: pointer; }
  .opt .t { flex-grow: 1; } .opt .s { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.5; }
  .switch { width: 46px; height: 28px; border-radius: 14px; background: var(--ok-text); position: relative; flex-shrink: 0; transition: background .2s; }
  .switch::after { content: ''; position: absolute; top: 3px; left: 21px; width: 22px; height: 22px; border-radius: 50%; background: #fff; transition: left .2s; }
  .switch.off { background: var(--line); } .switch.off::after { left: 3px; }
  .num { display: flex; align-items: center; gap: 6px; font-size: 14px; flex-shrink: 0; }
  .num b { min-width: 34px; text-align: center; }
  .num .btn { width: 34px; height: 34px; padding: 0; }
</style>
</head>
<body>
<div id="app"></div>
<a class="btn sm soft newchip" id="newchip" href="#">新消息 ↓</a>
<script src="/common.js"></script>
<script src="/cats-keys.js"></script>
<script>
const { api, esc, icon } = Maowo;
const $ = s => document.querySelector(s);
const parts = location.pathname.split('/').filter(Boolean); // cats, <id|new>, [settings]
const isNew = parts[1] === 'new';
const catId = isNew ? null : Number(parts[1]);
const isSettings = isNew || parts[2] === 'settings';
const isLore = parts[2] === 'lore';

const TOOL_ICON = { act: 'gamepad', get_state: 'gamepad', join_room: 'gamepad', create_room: 'gamepad', start_game: 'gamepad', leave_room: 'gamepad', list_games: 'gamepad', skip: 'gamepad', get_rules: 'rules', get_archive: 'archive', comment: 'chat', chat: 'chat', post_comment: 'chat', post_write: 'chat', post_list: 'chat', post_read: 'chat', post_vote: 'poll', inbox: 'bell', remember: 'notebook', recall: 'search', rewrite_notebook: 'notebook', set_alarm: 'bell', vault_save: 'box', vault_list: 'box', vault_read: 'box' };
const timeOf = iso => { const d = new Date(iso); const now = new Date(); const same = d.toDateString() === now.toDateString(); return `${same ? '今天' : Maowo.fmtDate(iso)} ${Maowo.fmtClock(iso)}`; };

// ============================================================
// The window
// ============================================================
let cat = null, lastId = 0, busy = false, items = [], moreBefore = false, firstId = 0, rewindable = [];

function drawTop() {
  $('#who').innerHTML = `${Maowo.avatar(cat)}<div><div class="n">${esc(cat.name)}</div><div class="m"><span class="dot ${busy ? 'busy' : cat.status.state}"></span><span>${esc(busy ? '正在想…' : cat.status.text)}</span></div></div>`;
  const m = $('#mute');
  m.classList.toggle('on', cat.mute);
  m.innerHTML = icon(cat.mute ? 'bellOff' : 'bell', 22, 1.7);
  m.setAttribute('aria-label', cat.mute ? '免打扰（开着）' : '免打扰（关着）');
  document.title = `${cat.name} · 猫们 · 猫窝`;
  const o = $('#ova');
  if (o) { o.classList.toggle('ova-on', !!cat.ova); o.setAttribute('aria-label', cat.ova ? '番外中，点这里结束' : '开始番外'); }
  drawBanner();
}

// The line above the input: 番外 going on, or this message is an order.
function drawBanner() {
  const b = $('#banner'), ta = $('#text');
  if (!b || !ta || !cat) return;
  const order = /^[$＄]/.test(ta.value);
  b.className = 'banner' + (cat.ova ? ' ova' : '');
  b.innerHTML = cat.ova
    ? `${icon('drama', 16, 1.8)}<span>番外中${order ? ' · 这条是戏外指令' : '：演完可以选要不要让它记得'}</span><button class="btn sm" id="ova-end">结束番外</button>`
    : order ? `<span>这条是<b>戏外指令</b>：它会照做，只管这一条。</span>` : '';
  const e = $('#ova-end'); if (e) e.onclick = endOva;
}

async function startOva() {
  if (!confirm(`开始番外？\n这一段可以随便演。演完点「结束番外」，可以选：让${cat.name}忘掉、只告诉它一句、或者留着。\n（游戏里它被叫醒做的事不算在番外里。）`)) return;
  try { await api(`/cats/${catId}/ova`, { json: { on: true } }); await reload(); } catch (err) { Maowo.toast(err.message); }
}
function endOva() {
  const panel = Maowo.sheet(`<h2>结束番外</h2>
    <div class="small muted" style="margin: 6px 0 14px; line-height: 1.6;">这一段番外要让${esc(cat.name)}记得吗？游戏里它被叫醒做的事不受影响。</div>
    <button class="opt" data-end="forget" style="width: 100%;"><div class="t">偷偷删掉<div class="s">它什么都不记得，小本本也回到番外之前，假装没发生过</div></div></button>
    <button class="opt" data-end="tell" style="width: 100%;"><div class="t">只告诉它一句<div class="s">删掉这一段，只留一两句概括。下面不写就让它自己总结，写了就用你写的</div></div></button>
    <textarea id="ova-line" rows="2" maxlength="500" placeholder="不写：它自己总结。也可以自己写，比如：我们演了一段校园番外，你是学长" style="margin: -2px 0 10px;"></textarea>
    <button class="opt" data-end="keep" style="width: 100%;"><div class="t">留着<div class="s">当成正常聊天，它会记得这一段</div></div></button>`);
  panel.querySelectorAll('[data-end]').forEach(b => b.onclick = async () => {
    if (b.dataset.end === 'tell' && !panel.querySelector('#ova-line').value.trim()) Maowo.toast('它在总结…');
    try {
      await api(`/cats/${catId}/ova`, { json: { on: false, end: b.dataset.end, line: panel.querySelector('#ova-line').value } });
      panel.close(); await reload();
    } catch (err) { Maowo.toast(err.message); }
  });
}

// Long-press one of her own messages: 从这句重来.
function armLongPress(el) {
  let timer = null, x = 0, y = 0;
  const stop = () => { clearTimeout(timer); timer = null; };
  el.addEventListener('pointerdown', e => { x = e.clientX; y = e.clientY; stop(); timer = setTimeout(() => { timer = null; mineMenu(Number(el.dataset.mine)); }, 550); });
  el.addEventListener('pointermove', e => { if (timer && Math.hypot(e.clientX - x, e.clientY - y) > 8) stop(); });
  el.addEventListener('pointerup', stop); el.addEventListener('pointercancel', stop); el.addEventListener('pointerleave', stop);
  el.addEventListener('contextmenu', e => { e.preventDefault(); mineMenu(Number(el.dataset.mine)); });
}
function mineMenu(id) {
  const it = items.find(i => i.id === id);
  if (!it) return;
  const can = rewindable.includes(id);
  const panel = Maowo.sheet(`<h2>这句话</h2><div class="detail-pre" style="margin: 8px 0 14px; max-height: 20vh;">${esc(it.text || '（图片）')}</div>
    ${can ? `<button class="btn primary block" id="rw">${icon('undo', 18, 2)}从这句重来</button>
      <div class="small muted" style="margin-top: 8px; line-height: 1.6;">这句和它后面的聊天都会从${esc(cat.name)}的记忆里拿掉，小本本也回到这句之前。这句话放回输入框，改一改再发。游戏里它做过的事不受影响。</div>`
      : `<div class="small muted" style="line-height: 1.6;">只能回到最近 10 句，这句太早了。</div>`}
    <button class="btn block" id="cp" style="margin-top: 12px;">复制</button>`);
  panel.querySelector('#cp').onclick = () => { Maowo.copy(it.text || ''); panel.close(); };
  const rw = panel.querySelector('#rw');
  if (rw) rw.onclick = async () => {
    try {
      const r = await api(`/cats/${catId}/rewind`, { json: { messageId: id } });
      panel.close();
      const ta = $('#text'); ta.value = r.text; ta.dispatchEvent(new Event('input'));
      await reload();
      if (r.images && r.images.length) Maowo.toast('图片要重新选一次');
      ta.focus();
    } catch (err) { Maowo.toast(err.message); }
  };
}
async function regenerate() {
  try { await api(`/cats/${catId}/regenerate`, { json: {} }); await reload(); } catch (err) { Maowo.toast(err.message); }
}

function rowHtml(it, prev) {
  let out = '';
  if (!prev || Date.parse(it.createdAt) - Date.parse(prev.createdAt) > 10 * 60000) out += `<div class="stamp">${timeOf(it.createdAt)}</div>`;
  if (it.kind === 'me') return out + (it.images && it.images.length ? `<div class="mepics ${it.images.length === 1 ? 'one' : ''}" data-mine="${it.id}">${it.images.map(f => `<button type="button" data-big="${esc(f)}" aria-label="看大图"><img data-img="${esc(f)}" alt="图片"></button>`).join('')}</div>` : '')
    + (it.text ? `<div class="b me ${it.order ? 'order' : ''} ${it.ova ? 'ova' : ''}" data-mine="${it.id}">${it.order ? '<span class="tag">戏外指令</span>' : ''}${esc(it.text)}</div>` : '');
  if (it.kind === 'say') return out + `<div class="b say ${it.ova ? 'ova' : ''}">${esc(it.text)}</div>`;
  if (it.kind === 'note') return out + `<div class="noteline">${esc(it.text)}</div>`;
  if (it.kind === 'aside') return out + `<div class="noteline aside">${esc(it.text)}</div>`;
  if (it.kind === 'wake') return out + `<div class="wakeline"><span>${esc(it.text)}</span></div>`;
  if (it.kind === 'result') {
    const bad = it.detail && /^错误/.test(it.detail.result || '');
    return out + `<button class="act ${bad ? 'bad' : ''}" data-detail="${it.id}">${icon(TOOL_ICON[it.detail?.tool] || 'sliders', 15, 1.8)}<span>${esc(it.text)}${bad ? '（没成功）' : ''}</span></button>`;
  }
  if (it.kind === 'error') return out + `<div class="err">${esc(it.text)}</div>`;
  if (it.kind === 'group') return out + (it.groupId
    ? `<a class="foldline" href="/cats/g/${it.groupId}">在群「${esc(it.group)}」里聊了 ${it.count} 句 ›</a>`
    : `<div class="foldline">在群「${esc(it.group)}」（已解散）里聊了 ${it.count} 句</div>`);
  return '';
}

function feedHtml() {
  let html = moreBefore ? '<button class="btn sm older" id="older">看更早的</button>' : '';
  if (!items.length) html += `<div class="empty">跟 ${esc(cat.name)} 打个招呼吧。<br>它会记得你们聊过的事。</div>`;
  let prev = null;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    if (it.kind === 'hidden') {
      // A run of hidden rows becomes one line.
      let j = i; while (j + 1 < items.length && items[j + 1].kind === 'hidden') j++;
      html += `<div class="hiddenline">「${esc(it.room || '一局游戏')}」还没结束，你也在这一桌。<br>${esc(cat.name)}在里面做的事先藏起来，结束后就能看了。</div>`;
      prev = items[j]; i = j; continue;
    }
    html += rowHtml(it, prev);
    prev = it;
  }
  if (busy) html += '<div class="typing">正在想 <i></i><i></i><i></i></div>';
  // 重新回答 under its last answer to her newest message.
  const last = items[items.length - 1];
  if (!busy && last && last.kind === 'say' && rewindable.length && items.some(i => i.kind === 'me' && i.id === rewindable[0]) && !items.some(i => i.id > rewindable[0] && i.kind === 'wake'))
    html += `<button class="regen" id="regen">${icon('retry', 13, 2)}重新回答</button>`;
  return html;
}

const feed = () => $('#feed');
const atBottom = () => { const f = feed(); return f.scrollHeight - f.scrollTop - f.clientHeight < 80; };
function toBottom() { const f = feed(); f.scrollTop = f.scrollHeight; $('#newchip').style.display = 'none'; }

function drawFeed({ stick, keepTop } = {}) {
  const f = feed();
  const wasBottom = atBottom();
  const oldHeight = f.scrollHeight, oldTop = f.scrollTop;
  $('#feed .in').innerHTML = feedHtml();
  f.querySelectorAll('[data-detail]').forEach(b => b.onclick = () => showDetail(items.find(x => String(x.id) === b.dataset.detail)));
  f.querySelectorAll('[data-mine]').forEach(armLongPress);
  const rg = f.querySelector('#regen'); if (rg) rg.onclick = regenerate;
  f.querySelectorAll('img[data-img]').forEach(im => picUrl(im.dataset.img).then(u => { im.src = u; im.onload = () => { if (stick || wasBottom) toBottom(); }; }).catch(() => {}));
  f.querySelectorAll('[data-big]').forEach(b => b.onclick = () => picUrl(b.dataset.big).then(u => {
    const box = document.createElement('div');
    box.className = 'lightbox'; box.innerHTML = `<img src="${u}" alt="">`;
    box.onclick = () => box.remove();
    document.body.appendChild(box);
  }));
  const older = $('#older');
  if (older) older.onclick = loadOlder;
  if (keepTop) f.scrollTop = f.scrollHeight - oldHeight + oldTop;
  else if (stick || wasBottom) toBottom();
  else $('#newchip').style.display = 'inline-flex';
}

// Pictures need the login, so they are fetched with the token and shown from memory.
const picCache = new Map();
function picUrl(file) {
  if (!picCache.has(file)) picCache.set(file, fetch(`/api/cats/${catId}/images/${encodeURIComponent(file)}`, { headers: { Authorization: 'Bearer ' + Maowo.token() } })
    .then(r => { if (!r.ok) throw new Error(r.status); return r.blob(); }).then(b => URL.createObjectURL(b)));
  return picCache.get(file);
}
// At most 1600px on the long side, as JPEG (GIFs stay, to keep moving) — the same as pictures in posts.
async function shrink(file) {
  if (file.type === 'image/gif' && file.size <= 3 * 1024 * 1024) return file;
  let src;
  try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
  catch { src = await new Promise((ok, fail) => { const im = new Image(); im.onload = () => ok(im); im.onerror = fail; im.src = URL.createObjectURL(file); }); }
  const w = src.width, h = src.height, k = Math.min(1, 1600 / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.round(w * k); c.height = Math.round(h * k);
  const g = c.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height);
  g.drawImage(src, 0, 0, c.width, c.height);
  return new Promise(ok => c.toBlob(ok, 'image/jpeg', 0.85));
}

function showDetail(it) {
  if (!it || !it.detail) return;
  const d = it.detail;
  Maowo.sheet(`<h2>${esc(it.text)}</h2>
    <div class="small muted" style="margin: 2px 0 12px;">工具 ${esc(d.tool)} · ${timeOf(it.createdAt)}</div>
    ${Object.keys(d.args || {}).length ? `<label class="field" style="margin-top: 0;">它填的</label><div class="detail-pre mono">${esc(JSON.stringify(d.args, null, 2))}</div>` : ''}
    <label class="field">猫窝回它的</label><div class="detail-pre">${esc(d.result || '')}</div>`);
}

function merge(newItems) {
  const seen = new Set(items.map(i => i.id));
  for (const it of newItems) if (!seen.has(it.id)) items.push(it);
}

async function loadOlder() {
  const d = await api(`/cats/${catId}/messages?before=${firstId}`);
  items = [...d.items.filter(i => i.id < firstId), ...items];
  moreBefore = d.more;
  if (d.items.length) firstId = d.items[0].id;
  drawFeed({ keepTop: true });
}

// Long polling: the server answers as soon as something new is there, or after 25 s.
let polling = false;
async function poll() {
  if (polling) return;
  polling = true;
  for (;;) {
    try {
      const d = await api(`/cats/${catId}/wait?after=${lastId}&busy=${busy ? 1 : 0}`);
      const grew = d.items.length > 0 || d.busy !== busy;
      cat = d.cat; busy = d.busy;
      if (d.rewindable) rewindable = d.rewindable;
      merge(d.items);
      if (d.lastId) lastId = Math.max(lastId, d.lastId);
      drawTop();
      if (grew) drawFeed();
      Maowo.tellUnread();
    } catch (err) {
      if (/找不到/.test(err.message)) { Maowo.toast(err.message); return; }
      await new Promise(r => setTimeout(r, 4000));
    }
  }
}

// Seats change the meaning of old rows (a game ends and its part shows): reload everything now and then.
async function reload() {
  const d = await api(`/cats/${catId}/messages`);
  cat = d.cat; busy = d.busy; items = d.items; moreBefore = d.more; rewindable = d.rewindable || [];
  firstId = items.length ? items[0].id : 0;
  lastId = d.lastId;
  drawTop(); drawFeed({ stick: true });
}

function showNotebook() {
  const panel = Maowo.sheet(`<h2>${esc(cat.name)}的小本本</h2><div id="nb-body"><div class="small muted">读取中…</div></div>`);
  let editing = false, data = null;
  const draw = () => {
    const body = panel.querySelector('#nb-body');
    const lines = data.notebook.split('\n').map(l => l.trim()).filter(Boolean);
    body.innerHTML = editing ? `
      <div class="small muted" style="margin-bottom: 10px; line-height: 1.6;">一行一条。改完点保存，它下次醒来就会看到新的。</div>
      <textarea id="nb-text" rows="9" style="resize: vertical; font-size: 14px; line-height: 1.6;">${esc(data.notebook)}</textarea>
      <label class="field">很久以前的事（旧对话的摘要）</label>
      <textarea id="nb-sum" rows="6" style="resize: vertical; font-size: 13px; line-height: 1.6;">${esc(data.summary)}</textarea>
      <div class="row" style="margin-top: 12px;"><button class="btn primary" id="nb-save">保存</button><button class="btn" id="nb-cancel">不改了</button></div>`
      : `<div class="small muted" style="margin-bottom: 10px; line-height: 1.6;">它自己觉得重要、想一直记着的事。你也可以改、可以删。</div>
      ${lines.length ? `<div class="nb">${lines.map(l => { const m = l.match(/^(\d{1,2}\/\d{1,2})\s+(.*)$/); return `<div class="nb-line">${m ? `<span class="muted small" style="flex-shrink: 0; width: 38px; padding-top: 2px;">${esc(m[1])}</span>${esc(m[2])}` : esc(l)}</div>`; }).join('')}</div>` : '<div class="empty" style="padding: 14px 0;">还什么都没记</div>'}
      <div class="row" style="margin-top: 12px;"><button class="btn sm" id="nb-edit">改一改</button></div>
      <div class="ribbon" style="margin-top: 22px;"><span class="tag" style="font-size: 16px;">很久以前的事</span><span class="rule"></span></div>
      ${data.summary ? `<div class="sum">${esc(data.summary)}</div>` : '<div class="small muted" style="line-height: 1.6;">聊天太长时，旧的部分会压成一段摘要放在这里，它每次醒来都会看到。现在还没有。</div>'}`;
    const e = body.querySelector('#nb-edit'); if (e) e.onclick = () => { editing = true; draw(); };
    const c = body.querySelector('#nb-cancel'); if (c) c.onclick = () => { editing = false; draw(); };
    const s = body.querySelector('#nb-save'); if (s) s.onclick = async () => {
      try { data = await api(`/cats/${catId}/notebook`, { method: 'PUT', json: { notebook: body.querySelector('#nb-text').value, summary: body.querySelector('#nb-sum').value } }); editing = false; draw(); Maowo.toast('保存好了'); }
      catch (err) { Maowo.toast(err.message); }
    };
  };
  api(`/cats/${catId}/notebook`).then(d => { data = d; draw(); }).catch(err => Maowo.toast(err.message));
}

function startChat() {
  document.body.classList.add('chat');
  $('#app').innerHTML = `
    <div class="top"><header>
      <a class="icon-btn" id="back" aria-label="返回猫们">${icon('back', 22)}</a>
      <div class="who" id="who"></div>
      <button class="icon-btn" id="ova" aria-label="番外">${icon('drama', 22, 1.7)}</button>
      <button class="icon-btn" id="mute"></button>
      <button class="icon-btn" id="book" aria-label="小本本">${icon('notebook', 22, 1.7)}</button>
      <a class="icon-btn" id="set" href="/cats/${catId}/settings" aria-label="设置">${icon('sliders', 22, 1.7)}</a>
    </header></div>
    <div id="feed"><div class="in"></div></div>
    <div class="bottom"><div class="banner" id="banner"></div><div class="picks" id="picks"></div><form id="say"><button type="button" class="pic-btn" id="pic" aria-label="发图片">${icon('image', 21, 1.7)}</button><button type="button" class="dollar" id="dollar" aria-label="戏外指令">$</button><textarea id="text" rows="1" maxlength="4000" placeholder="说点什么…"></textarea><button class="btn primary" type="submit" aria-label="发送">${icon('send', 18, 2)}</button></form>
      <input type="file" id="picfile" accept="image/*" multiple hidden></div>`;
  Maowo.backTo($('#back'), '/cats');
  $('#book').onclick = showNotebook;
  $('#mute').onclick = async () => {
    try {
      cat = await api(`/cats/${catId}`, { method: 'PUT', json: { mute: !cat.mute } });
      drawTop(); Maowo.tellUnread();
      Maowo.toast(cat.mute ? '开了免打扰：它说话不出红点，消息照样留着' : '关了免打扰');
    } catch (err) { Maowo.toast(err.message); }
  };
  const ta = $('#text');
  $('#ova').onclick = () => cat.ova ? endOva() : startOva();
  // $ at the start makes it an order from outside the story: the button just adds or takes away the $.
  const drawOrder = () => { $('#dollar').classList.toggle('on', /^[$＄]/.test(ta.value)); drawBanner(); };
  $('#dollar').onclick = () => { ta.value = /^[$＄]/.test(ta.value) ? ta.value.replace(/^[$＄]\s*/, '') : '$ ' + ta.value; drawOrder(); ta.focus(); };
  ta.addEventListener('input', drawOrder);
  const grow = () => { ta.style.height = '44px'; ta.style.height = Math.min(ta.scrollHeight + 2, 132) + 'px'; ta.style.overflowY = ta.scrollHeight + 2 > 132 ? 'auto' : 'hidden'; };
  ta.addEventListener('input', grow);
  try { ta.value = sessionStorage.getItem(`maowo-cat-draft-${catId}`) || ''; grow(); } catch {}
  ta.addEventListener('input', () => { try { sessionStorage.setItem(`maowo-cat-draft-${catId}`, ta.value); } catch {} });
  // Pictures waiting to be sent (up to 4), shown above the box.
  let picks = [];
  const drawPicks = () => {
    $('#picks').innerHTML = picks.map((p, i) => `<div class="pk"><img src="${p.url}" alt=""><button type="button" data-unpick="${i}" aria-label="不发这张">${icon('close', 14, 2.2)}</button></div>`).join('');
    document.querySelectorAll('[data-unpick]').forEach(b => b.onclick = () => { picks.splice(Number(b.dataset.unpick), 1); drawPicks(); });
  };
  $('#pic').onclick = () => { if (picks.length >= 4) return Maowo.toast('一次最多 4 张'); $('#picfile').click(); };
  $('#picfile').onchange = e => {
    const files = [...e.target.files].filter(f => f.type.startsWith('image/'));
    e.target.value = '';
    if (picks.length + files.length > 4) Maowo.toast('一次最多 4 张，多的先不发');
    for (const f of files.slice(0, 4 - picks.length)) picks.push({ file: f, url: URL.createObjectURL(f) });
    drawPicks();
  };
  let sending = false;
  $('#say').onsubmit = async e => {
    e.preventDefault();
    const text = ta.value.trim();
    if ((!text && !picks.length) || sending) return;
    sending = true;
    const sent = picks;
    picks = []; drawPicks();
    ta.value = ''; grow();
    try {
      const images = [];
      for (const p of sent) {
        const blob = await shrink(p.file);
        const res = await fetch(`/api/cats/${catId}/images`, { method: 'POST', headers: { Authorization: 'Bearer ' + Maowo.token(), 'Content-Type': blob.type || 'image/jpeg' }, body: blob });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error || res.status);
        images.push(out.file);
      }
      await api(`/cats/${catId}/messages`, { json: { text, images } });
      try { sessionStorage.removeItem(`maowo-cat-draft-${catId}`); } catch {}
    } catch (err) { Maowo.toast(err.message); ta.value = text; grow(); picks = sent; drawPicks(); }
    sending = false;
    drawOrder();
  };
  $('#newchip').onclick = e => { e.preventDefault(); toBottom(); };
  feed().addEventListener('scroll', () => { if (atBottom()) $('#newchip').style.display = 'none'; });
  reload().then(poll).catch(err => { Maowo.toast(err.message); if (/找不到/.test(err.message)) setTimeout(() => Maowo.go('/cats'), 1200); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) reload().catch(() => {}); });
  // A hidden game part shows again once the game ends: look again every minute while something is hidden.
  setInterval(() => { if (!document.hidden && items.some(i => i.kind === 'hidden')) reload().catch(() => {}); }, 60000);
}

      ${c ? `<button type="button" class="opt" id="o-tools"><div class="t">能用工具<div class="s">玩游戏、发帖、记小本本都要用工具。它这条线路用不了时，猫窝会自动关掉，改成只聊天</div></div><span class="switch ${f.toolsOk ? '' : 'off'}"></span></button>` : ''}
      ${c ? `<button type="button" class="opt" id="o-vision"><div class="t">能看图片<div class="s">你发的图片给它看。用的模型看不了图片时，猫窝会自动关掉这个</div></div><span class="switch ${f.vision ? '' : 'off'}"></span></button>` : ''}
      <button type="button" class="opt" id="o-alarm"><div class="t">让它自己定闹钟<div class="s">它可以说「3 小时后叫我」，到点自己去逛逛</div></div><span class="switch ${f.alarms ? '' : 'off'}"></span></button>
      <div class="opt" style="cursor: default;"><div class="t">每天最多叫醒<div class="s">到了就睡到明天（北京时间零点），防止花太多钱。你跟它说话不算在里面。${c ? `今天叫醒了 ${c.todayWakes} 次。` : ''}</div></div>
        <div class="num"><button type="button" class="btn" id="minus">−</button><b id="limit">${f.dailyLimit}</b><button type="button" class="btn" id="plus">+</button>次</div></div>

      <button class="btn primary block" id="save" style="margin-top: 18px;">${c ? '保存' : '搬进来'}</button>
      ${c ? `<div class="row" style="margin-top: 14px;"><button class="btn sm danger" id="forget">清空它的记忆</button><button class="btn sm danger" id="moveout">请它搬走</button></div>` : ''}
    </main>`;
    CatKit.oneLine($('#app'));
    Maowo.backTo($('#back'), c ? `/cats/${c.id}` : '/cats');
    const keep = () => { f.name = $('#f-name').value; f.bio = $('#f-bio').value; f.systemPrompt = $('#f-prompt').value; };
    document.querySelectorAll('[data-key]').forEach(b => b.onclick = () => { keep(); const id = Number(b.dataset.key); if (id !== f.keyId) { f.keyId = id; f.model = ''; } draw(); });
    document.querySelectorAll('[data-mask]').forEach(b => b.onclick = () => { keep(); f.maskId = b.dataset.mask ? Number(b.dataset.mask) : null; draw(); });
    $('#masks-manage').onclick = () => { keep(); CatKit.masks(async () => {
      masks = c ? (await api(`/cats/${c.id}`)).masks : (await api('/cats/masks')).filter(m => !m.catId);
      if (f.maskId && !masks.some(m => m.id === f.maskId)) f.maskId = null;
      draw();
    }); };
    const cu = $('#card-up'); if (cu) cu.onclick = () => $('#card-file').click();
    const cf = $('#card-file'); if (cf) cf.onchange = async e => {
      const file = e.target.files[0]; e.target.value = '';
      if (!file) return;
      keep();
      if ((f.name.trim() || f.systemPrompt.trim()) && !confirm('用角色卡里的名字和设定换掉现在填的？')) return;
      Maowo.toast('读取中…');
      try {
        const res = await fetch(`/api/cats/card?name=${encodeURIComponent(file.name)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + Maowo.token(), 'Content-Type': 'application/octet-stream' }, body: file });
        const out = await res.json(); if (!res.ok) throw new Error(out.error || res.status);
        card = { ...out, file };
        f.name = out.name; f.systemPrompt = out.systemPrompt;
        draw();
        Maowo.toast(out.fullName.length > 16 ? '名字超过 16 个字，截短了，可以再改' : '读好了，看看对不对');
      } catch (err) { Maowo.toast(err.message); }
    };
    $('#prompt-up').onclick = () => $('#prompt-file').click();
    $('#prompt-file').onchange = async e => {
      const file = e.target.files[0];
      e.target.value = '';
      if (!file) return;
      if ($('#f-prompt').value.trim() && !confirm(`用「${file.name}」里的文字换掉现在写的 System prompt？`)) return;
      Maowo.toast('读取中…');
      try {
        const res = await fetch(`/api/file-text?name=${encodeURIComponent(file.name)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + Maowo.token(), 'Content-Type': 'application/octet-stream' }, body: file });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error || res.status);
        if (out.text.length > 20000) Maowo.toast(`文件有 ${out.text.length} 字，System prompt 最多 2 万字，只放了前 2 万字。长的设定可以放进世界书`);
        else Maowo.toast(`读好了，约 ${out.text.length} 字。记得点保存`);
        $('#f-prompt').value = out.text.slice(0, 20000);
        keep();
      } catch (err) { Maowo.toast(err.message); }
    };
    $('#addkey').onclick = () => { keep(); CatKit.keys(async () => { keys = (await api('/cats')).keys; if (!f.keyId && keys[0]) f.keyId = keys[0].id; draw(); }); };
    $('#pickmodel').onclick = () => { keep(); CatKit.models(f.keyId, key.name, f.model, m => { f.model = m; draw(); }); };
    $('#test').onclick = async () => {
      const out = $('#test-out');
      out.textContent = '测试中…'; out.className = 'small muted';
      try {
        const r = await api('/cats/test', { json: { keyId: f.keyId, model: f.model } });
        out.innerHTML = r.tools ? '<span class="pill ok">能用 · 会用工具</span>' : '<span class="pill secret">能说话，但不会用工具</span>';
        if (!r.tools) Maowo.toast(`这个模型没有调用工具：能聊天，但玩不了游戏、发不了帖。${r.reply ? `它回的是：「${r.reply.slice(0, 50)}」` : '它什么都没回。'}`);
      } catch (err) { out.textContent = ''; Maowo.toast(`测试没通过：${err.message}`); }
    };
    $('#o-turn').onclick = () => { keep(); f.wakeOnTurn = !f.wakeOnTurn; draw(); };
    $('#o-alarm').onclick = () => { keep(); f.alarms = !f.alarms; draw(); };
    const ov = $('#o-vision'); if (ov) ov.onclick = () => { keep(); f.vision = !f.vision; draw(); };
    const ot = $('#o-tools'); if (ot) ot.onclick = () => { keep(); f.toolsOk = !f.toolsOk; draw(); };
    const step = n => { keep(); f.dailyLimit = Math.max(10, Math.min(1000, (n > 0 ? Math.floor(f.dailyLimit / 10) * 10 + 10 : Math.ceil(f.dailyLimit / 10) * 10 - 10))); draw(); };
    $('#minus').onclick = () => step(-1);
    $('#plus').onclick = () => step(1);
    const pic = $('#pic'); if (pic) pic.onclick = () => Maowo.pickAvatar(c.id).then(async () => { keep(); Object.assign(c, await api(`/cats/${c.id}`)); draw(); }, () => {});
    $('#save').onclick = async e => {
      keep();
      if (!f.name.trim()) return Maowo.toast('先起个名字吧');
      e.currentTarget.disabled = true;
      try {
        if (c) { await api(`/cats/${c.id}`, { method: 'PUT', json: f }); Maowo.toast('保存好了'); setTimeout(() => Maowo.go(`/cats/${c.id}`), 500); }
        else {
          const n = await api('/cats', { json: { ...f, cardId: card ? card.cardId : undefined } });
          if (card && card.isPng) await cardAvatar(n.id, card.file).catch(() => Maowo.toast('头像没传上，可以在设置里自己换'));
          location.replace(`/cats/${n.id}`);
        }
      } catch (err) { Maowo.toast(err.message); e.currentTarget.disabled = false; }
    };
    const forget = $('#forget'); if (forget) forget.onclick = async () => {
      if (!confirm(`清空 ${c.name} 的记忆？聊天记录、小本本、摘要都会删掉，它会像刚搬进来一样。名字、设定、它发过的帖子不变。`)) return;
      try { await api(`/cats/${c.id}/memory`, { method: 'DELETE' }); Maowo.toast('清空了'); } catch (err) { Maowo.toast(err.message); }
    };
    const out = $('#moveout'); if (out) out.onclick = async () => {
      if (!confirm(`请 ${c.name} 搬走？它的窗口、聊天记录和小本本都会删掉，猫窝也不会再叫醒它。它的名字和发过的帖子还会留在猫窝里。`)) return;
      try { await api(`/cats/${c.id}`, { method: 'DELETE' }); Maowo.go('/cats'); } catch (err) { Maowo.toast(err.message); }
    };
  };
  draw();
}

// A card PNG is a tall picture: its avatar is a square from near the top (where the face usually is), 320px.
async function cardAvatar(id, file) {
  const img = await new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = URL.createObjectURL(file); });
  const side = Math.min(img.naturalWidth, img.naturalHeight);
  const sx = (img.naturalWidth - side) / 2, sy = Math.max(0, (img.naturalHeight - side) * 0.15);
  const cv = document.createElement('canvas'); cv.width = cv.height = Math.min(320, side);
  cv.getContext('2d').drawImage(img, sx, sy, side, side, 0, 0, cv.width, cv.height);
  const blob = await new Promise(ok => cv.toBlob(ok, 'image/jpeg', 0.9));
  const res = await fetch(`/api/avatar/${id}`, { method: 'PUT', headers: { Authorization: 'Bearer ' + Maowo.token(), 'Content-Type': 'image/jpeg' }, body: blob });
  if (!res.ok) throw new Error('avatar');
}

// ============================================================
// 世界书
// ============================================================
async function startLore() {
  const c = await api(`/cats/${catId}`);
  document.title = `${c.name}的世界书 · 猫窝`;
  let d = await api(`/cats/${catId}/lore`);
  const modeText = e => e.mode === 'always' ? '常驻' : e.keywords.length ? `关键词：${e.keywords.join('、')}` : '关键词（还没填）';
  const draw = () => {
    $('#app').innerHTML = `<main class="wrap">
      <header class="bar"><a class="icon-btn" id="back" aria-label="返回">${icon('back', 22)}</a><div class="muted" style="font-size: 13px;">${esc(c.name)} · 设置</div></header>
      <div class="ribbon"><span class="tag">${esc(c.name)}的世界书</span><span class="rule"></span></div>
      <div class="small muted" style="line-height: 1.7;">放它该知道的设定：人物、地点、关系、规矩……<br><b style="color: var(--text2);">常驻</b>的每次都带上；<b style="color: var(--text2);">关键词触发</b>的，聊天里出现关键词才带上，更省钱。只有 ${esc(c.name)} 自己看得到。</div>
      <div class="lore-tools"><button class="btn" id="lore-new">${icon('plus', 16, 2)}写一条</button><button class="btn" id="lore-up">${icon('archive', 16, 1.8)}上传文件</button></div>
      <input type="file" id="lore-file" accept=".txt,.md,.markdown,.doc,.docx,.json,.png,text/plain,application/json,image/png,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document" hidden>
      <div class="hint" style="margin: -2px 0 14px;">支持 txt、md、doc、docx（Word / WPS），也能导入酒馆导出的世界书 json；角色卡（json / png）会导入它自带的世界书。</div>
      ${d.alwaysLength > 3000 ? `<div class="warn">常驻的一共约 ${d.alwaysLength} 字，每次叫醒都会带上，比较费钱${d.alwaysLength > d.alwaysMax ? `（超过 ${d.alwaysMax} 字的部分不会带上）` : ''}。不是每次都要用的，可以改成「关键词触发」。</div>` : ''}
      ${d.entries.map(e => `<button class="lore ${e.enabled ? '' : 'off'}" data-lore="${e.id}">
        <div class="h"><b>${esc(e.title)}</b><span class="pill ${e.mode === 'always' ? 'ok' : ''}">${esc(modeText(e).length > 18 ? modeText(e).slice(0, 18) + '…' : modeText(e))}</span>${e.enabled ? '' : '<span class="pill">关着</span>'}</div>
        <div class="p">${esc(e.content.slice(0, 200))}</div>
        <div class="f">约 ${e.length} 字${e.source ? ` · 来自 ${esc(e.source)}` : ''}</div></button>`).join('') || '<div class="empty">还没有世界书</div>'}
    </main>`;
    Maowo.backTo($('#back'), `/cats/${catId}/settings`);
    $('#lore-new').onclick = () => edit(null);
    $('#lore-up').onclick = () => $('#lore-file').click();
    $('#lore-file').onchange = async e => {
      const f = e.target.files[0];
      e.target.value = '';
      if (!f) return;
      Maowo.toast('读取中…');
      try {
        const res = await fetch(`/api/cats/${catId}/lore/upload?name=${encodeURIComponent(f.name)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + Maowo.token(), 'Content-Type': 'application/octet-stream' }, body: f });
        const out = await res.json();
        if (!res.ok) throw new Error(out.error || res.status);
        d = out; draw();
        Maowo.toast(out.cut ? '文件太长，只存了前 10 万字' : out.added > 1 ? `导入了 ${out.added} 条` : '加好了');
      } catch (err) { Maowo.toast(err.message); }
    };
    document.querySelectorAll('[data-lore]').forEach(b => b.onclick = () => edit(d.entries.find(x => x.id === Number(b.dataset.lore))));
  };
  const edit = e => {
    const f = e ? { ...e, keywords: e.keywords.join('、') } : { title: '', content: '', mode: 'always', keywords: '', enabled: true };
    const p = Maowo.sheet('<div id="le"></div>');
    const drawEdit = () => {
      p.querySelector('#le').innerHTML = `<h2>${e ? '改一改' : '写一条'}</h2>
        <label class="field">标题（自己认得就行）</label><textarea class="single" rows="1" id="le-title" maxlength="40">${esc(f.title)}</textarea>
        <label class="field">什么时候带上</label>
        <div class="modes"><button type="button" data-m="always" class="${f.mode === 'always' ? 'on' : ''}"><b>常驻</b><span>每次叫醒都带上</span></button><button type="button" data-m="keyword" class="${f.mode === 'keyword' ? 'on' : ''}"><b>关键词触发</b><span>聊到关键词才带上，省钱</span></button></div>
        ${f.mode === 'keyword' ? `<label class="field">关键词（用顿号或逗号隔开，最近的聊天里出现任何一个就带上）</label><textarea class="single" rows="1" id="le-kw" placeholder="比如：小叶、长明、悄悄话">${esc(f.keywords)}</textarea>` : ''}
        <label class="field">内容</label><textarea id="le-content" rows="10" style="resize: vertical; font-size: 14px; line-height: 1.65;">${esc(f.content)}</textarea>
        ${e ? `<button type="button" class="opt" id="le-on" style="margin-top: 10px;"><div class="t">用这一条<div class="s">关掉的话，先不带上，但不删</div></div><span class="switch ${f.enabled ? '' : 'off'}"></span></button>` : ''}
        <button class="btn primary block" id="le-save" style="margin-top: 14px;">保存</button>
        ${e ? '<button class="btn sm danger" id="le-del" style="margin-top: 12px;">删掉这一条</button>' : ''}`;
      CatKit.oneLine(p);
      const keep = () => { f.title = p.querySelector('#le-title').value; f.content = p.querySelector('#le-content').value; const k = p.querySelector('#le-kw'); if (k) f.keywords = k.value; };
      p.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { keep(); f.mode = b.dataset.m; drawEdit(); });
      const on = p.querySelector('#le-on'); if (on) on.onclick = () => { keep(); f.enabled = !f.enabled; drawEdit(); };
      p.querySelector('#le-save').onclick = async () => {
        keep();
        if (f.mode === 'keyword' && !String(f.keywords).trim()) return Maowo.toast('关键词触发要填至少一个关键词');
        try {
          const json = { title: f.title, content: f.content, mode: f.mode, keywords: f.keywords, enabled: f.enabled };
          d = e ? await api(`/cats/${catId}/lore/${e.id}`, { method: 'PUT', json }) : await api(`/cats/${catId}/lore`, { json });
          p.close(); draw(); Maowo.toast('保存好了');
        } catch (err) { Maowo.toast(err.message); }
      };
      const del = p.querySelector('#le-del'); if (del) del.onclick = async () => {
        if (!confirm(`删掉「${e.title}」？`)) return;
        try { d = await api(`/cats/${catId}/lore/${e.id}`, { method: 'DELETE' }); p.close(); draw(); } catch (err) { Maowo.toast(err.message); }
      };
    };
    drawEdit();
  };
  draw();
}

if (isLore) startLore().catch(err => { Maowo.toast(err.message); if (/找不到/.test(err.message)) setTimeout(() => Maowo.go('/cats'), 1200); });
else if (isSettings) startSettings().catch(err => { Maowo.toast(err.message); if (/找不到/.test(err.message)) setTimeout(() => Maowo.go('/cats'), 1200); });
else startChat();
</script>
