<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F7EEE1">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<title>猫们 · 猫窝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<style>
  main { position: relative; }
  .head { display: flex; align-items: center; gap: 8px; padding: 18px 0 12px; }
  .head h1 { font-family: "Noto Serif SC", serif; font-size: 26px; margin: 0; flex: 1; min-width: 0; }
  .head .icon-btn { background: var(--card); border: 1px solid var(--border); }
  .paused { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--secret-text, #A9503C); padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--border); margin-bottom: 10px; text-decoration: none; }
  /* one small row per cat: avatar, name, the newest line */
  .resident { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); margin-bottom: 9px; text-decoration: none; color: inherit;
    -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; position: relative; }
  .resident .avatar { width: 46px; height: 46px; font-size: 18px; border-radius: 13px; flex-shrink: 0; }
  .resident .body { flex: 1; min-width: 0; }
  .resident .n { font-size: 15.5px; font-weight: 600; display: flex; align-items: center; gap: 6px; min-width: 0; }
  .resident .n .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .resident .st { font-size: 12.5px; color: var(--text2); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok-text); flex-shrink: 0; }
  .dot.sleep { background: var(--line); } .dot.play, .dot.busy { background: var(--accent-line); }
  .dot.busy { animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .side { display: flex; align-items: center; gap: 6px; flex-shrink: 0; color: var(--muted); }
  .unread { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #D2483A; color: #fff; font-size: 11px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; }
  .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--white); border: 1px solid var(--border); color: var(--muted); }
  .gstack { position: relative; width: 46px; height: 46px; flex-shrink: 0; }
  .resident .gstack .avatar { position: absolute; width: 27px; height: 27px; font-size: 11px; border: 2px solid var(--card); border-radius: 9px; }
  .gstack .avatar:nth-child(1) { left: 0; top: 0; } .gstack .avatar:nth-child(2) { right: 0; top: 6px; } .gstack .avatar:nth-child(3) { left: 10px; bottom: 0; }
  .gstack .avatar:only-child { left: 6px; top: 6px; width: 34px; height: 34px; }
  /* 移动位置: arrows on each row, 「好了」 on top */
  .moving .resident { border-style: dashed; }
  .mv { display: flex; gap: 4px; }
  .mv button { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--white); color: var(--text); display: grid; place-items: center; padding: 0; cursor: pointer; }
  .mv button[disabled] { opacity: .3; }
  .movebar { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--text2); margin-bottom: 10px; }
  .movebar span { flex: 1; }
  .acts { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .first { padding: 16px; border-radius: 18px; background: var(--card); border: 1px solid var(--border); font-size: 14px; color: var(--text2); line-height: 1.75; margin-bottom: 14px; }
  .first b { color: var(--text); }
</style>
</head>
<body>
<main class="wrap">
  <div class="head"><h1>猫们</h1><a class="icon-btn" id="manage" href="/cats/manage" aria-label="猫们的设置"></a></div>
  <div id="content"><div class="empty">读取中…</div></div>
</main>
<script src="/common.js"></script>
<script>
const { api, esc, icon } = Maowo;
const $ = s => document.querySelector(s);
Maowo.tabbar('cats');
$('#manage').innerHTML = icon('sliders', 21, 1.7);

const side = x => `<span class="side">${x.pinned ? '<span class="chip">置顶</span>' : ''}${x.mute ? icon('bellOff', 15, 1.8) : x.unread ? `<span class="unread">${x.unread > 99 ? '99+' : x.unread}</span>` : ''}</span>`;
const mv = (i, n) => `<span class="mv"><button type="button" data-up ${i ? '' : 'disabled'} aria-label="上移">${icon('chevronUp', 18, 2)}</button><button type="button" data-down ${i < n - 1 ? '' : 'disabled'} aria-label="下移">${icon('chevronDown', 18, 2)}</button></span>`;
const keyOf = x => `${x.type === 'group' ? 'g' : 'c'}:${x.id}`;

function catCard(c, i, n) {
  // While it is busy or at a table that is what the line says; otherwise the newest thing said.
  const line = c.status.state === 'busy' || c.status.state === 'play' || !c.last ? c.status.text : (c.last.mine ? '你：' : '') + c.last.text;
  return `<a class="resident" data-key="c:${c.id}" href="/cats/${c.id}">${Maowo.avatar(c)}
    <div class="body"><div class="n"><span class="nm">${esc(c.name)}</span><span class="dot ${c.status.state}"></span></div><div class="st">${esc(line)}</div></div>
    ${moving ? mv(i, n) : side(c)}</a>`;
}
function groupCard(g, i, n) {
  const ms = g.members.filter(m => m.isCat);
  return `<a class="resident" data-key="g:${g.id}" href="/cats/g/${g.id}"><span class="gstack">${ms.slice(0, 3).map(m => Maowo.avatar(m)).join('')}</span>
    <div class="body"><div class="n"><span class="nm">${esc(g.name)}</span></div>
      <div class="st">${g.last ? `${esc(g.last.name)}：${esc(g.last.text.length > 40 ? g.last.text.slice(0, 40) + '…' : g.last.text)}` : `群聊 · ${esc(ms.map(m => m.name).join('、') || '还没有猫')}`}</div></div>
    ${moving ? mv(i, n) : side(g)}</a>`;
}

let data = null, moving = false;
function render(d) {
  data = d;
  const n = d.items.length;
  const html = `
    ${d.paused ? `<a class="paused" href="/cats/manage">${icon('bellOff', 15, 1.8)}现在全部暂停了：谁也不会被叫醒。点这里去打开</a>` : ''}
    ${moving ? `<div class="movebar"><span>点箭头换位置。置顶的总在最前面。</span><button class="btn sm primary" id="done">好了</button></div>` : ''}
    ${!n ? `<div class="first">还没有猫住进来。<br>点右上角的按钮，先放一把 <b>钥匙</b>（API key），再 <b>搬进来一只新猫</b>。</div>` : ''}
    <div id="list" class="${moving ? 'moving' : ''}">${d.items.map((x, i) => x.type === 'group' ? groupCard(x, i, n) : catCard(x, i, n)).join('')}</div>`;
  if (!Maowo.setHtml($('#content'), html)) return;
  const done = $('#done'); if (done) done.onclick = () => { moving = false; render(data); };
  document.querySelectorAll('#list .resident').forEach(arm);
}

// ---------- long press: 置顶 / 免打扰 / 移动位置 ----------
let pressed = false;
function arm(card) {
  const item = data.items.find(x => keyOf(x) === card.dataset.key);
  if (moving) {
    card.addEventListener('click', e => {
      e.preventDefault();
      const up = e.target.closest('[data-up]'), down = e.target.closest('[data-down]');
      if (up || down) shift(item, up ? -1 : 1);
    });
    return;
  }
  let timer = null, x0 = 0, y0 = 0;
  const cancel = () => { clearTimeout(timer); timer = null; };
  card.addEventListener('contextmenu', e => e.preventDefault());
  card.setAttribute('draggable', 'false');
  card.addEventListener('pointerdown', e => {
    if (e.button !== 0) return;
    pressed = false; x0 = e.clientX; y0 = e.clientY;
    timer = setTimeout(() => { timer = null; pressed = true; try { navigator.vibrate && navigator.vibrate(20); } catch {} menu(item); }, 550);
  });
  card.addEventListener('pointermove', e => { if (timer && (Math.abs(e.clientY - y0) > 10 || Math.abs(e.clientX - x0) > 10)) cancel(); });
  card.addEventListener('pointerup', cancel);
  card.addEventListener('pointercancel', cancel);
  card.addEventListener('click', e => { if (pressed) { e.preventDefault(); e.stopPropagation(); pressed = false; } }, true);
}
const put = (item, json) => api(item.type === 'group' ? `/cats/groups/${item.id}` : `/cats/${item.id}`, { method: 'PUT', json });
function menu(item) {
  const p = Maowo.sheet(`<h2>${esc(item.name)}</h2><div class="acts">
    <button class="btn block" id="m-pin">${icon('pin', 18, 1.8)}${item.pinned ? '取消置顶' : '置顶'}</button>
    <button class="btn block" id="m-mute">${icon(item.mute ? 'bell' : 'bellOff', 18, 1.8)}${item.mute ? '关掉免打扰' : '免打扰'}</button>
    ${data.items.length > 1 ? `<button class="btn block" id="m-move">${icon('chevronUp', 18, 2)}移动位置</button>` : ''}</div>
    <div class="small muted" style="margin-top: 10px; line-height: 1.6;">免打扰：它说话不出红点，消息照样留着。</div>`);
  const run = async (json, say) => { try { await put(item, json); p.close(); Maowo.toast(say); await load(); } catch (err) { Maowo.toast(err.message); } };
  p.querySelector('#m-pin').onclick = () => run({ pinned: !item.pinned }, item.pinned ? '不置顶了' : '置顶了');
  p.querySelector('#m-mute').onclick = () => run({ mute: !item.mute }, item.mute ? '关了免打扰' : '开了免打扰');
  const m = p.querySelector('#m-move'); if (m) m.onclick = () => { p.close(); moving = true; render(data); };
}
async function shift(item, by) {
  const list = data.items;
  const i = list.indexOf(item), j = i + by;
  if (j < 0 || j >= list.length) return;
  // Pinned ones stay in front: only swap inside the same part.
  if (!!list[j].pinned !== !!item.pinned) return Maowo.toast(item.pinned ? '置顶的排在最前面，先取消置顶才能往下放' : '上面是置顶的，越不过去');
  [list[i], list[j]] = [list[j], list[i]];
  render({ ...data });
  try { await api('/cats/order', { method: 'PUT', json: { items: list.map(keyOf) } }); } catch (err) { Maowo.toast(err.message); }
}

async function load() { const d = await api('/cats'); render(d); Maowo.tellUnread(); }
window.maowoRefresh = () => load().catch(() => {});
load().catch(err => Maowo.toast(err.message));
// The status line changes on its own (thinking, playing, sleeping): look again now and then while it is on screen.
setInterval(() => { if (!document.hidden && !moving) load().catch(() => {}); }, 15000);
</script>
</body>
</html>
