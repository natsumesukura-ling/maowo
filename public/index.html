<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#F7EEE1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="猫窝">
<link rel="icon" href="/img/favicon.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">

<title>游戏 · 猫窝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/common.css">
<style>
  main { position: relative; overflow-x: clip; }
  .hero { position: relative; padding-top: 44px; }
  .hero .vine { right: -22px; top: -6px; width: 104px; }
  .hero .lamp { right: 66px; top: -4px; width: 46px; }
  .hero h1 { font-size: 30px; font-weight: 700; margin: 0; letter-spacing: 1px; position: relative; }
  .hero p { margin: 8px 0 0; color: var(--text2); font-size: 14px; position: relative; }
  .hero .shelfcat { width: 100%; margin-top: 4px; }
  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
  .game {
    position: relative; text-align: center; padding: 10px 12px 12px; border-radius: 20px; background: var(--card);
    border: 1px solid var(--border); box-shadow: var(--shadow); cursor: pointer; font: inherit; color: inherit;
    display: flex; flex-direction: column; align-items: stretch;
  }
  .game.mine { border: 1.5px solid var(--accent-line); }
  .game.todo { background: transparent; border: 1.5px dashed var(--line); box-shadow: none; cursor: default; }
  .game .pic { height: 66px; display: flex; align-items: center; justify-content: center; }
  .game .pic img { max-height: 64px; max-width: 80%; }
  .game.todo .pic img { opacity: .75; }
  .game .name { font-family: "Noto Serif SC", serif; font-weight: 700; font-size: 19px; margin-top: 4px; letter-spacing: 2px; }
  .game .status { display: flex; align-items: center; gap: 6px; margin-top: 6px; font-size: 12.5px; color: var(--text2); text-align: left; }
  .game .status .txt { flex-grow: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .game .status .chev { color: var(--accent); display: flex; }
  .game.todo .status, .game.todo .status .chev { color: var(--muted); }
  .dot { width: 9px; height: 9px; border-radius: 50%; border: 1.5px solid var(--muted); flex-shrink: 0; }
  .dot.live { background: var(--accent); border-color: var(--accent); }
  .arch-wrap { margin-top: 26px; }
  .live-room {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px; margin-bottom: 10px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); text-decoration: none; color: inherit;
  }
  .live-room.mine { border: 1.5px solid var(--accent-line); }
  .live-room .thumb { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .live-room .thumb img { max-width: 40px; max-height: 40px; }
  .live-room .name { font-size: 15px; font-weight: 600; }
  .live-room .meta { font-size: 12px; color: var(--muted); margin-top: 3px; }
  .live-room .you { font-size: 12px; color: var(--accent); font-weight: 600; white-space: nowrap; }
  .arch {
    position: relative; display: flex; align-items: center; gap: 12px; padding: 10px 40px 10px 12px; margin-bottom: 10px;
    border-radius: 16px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); text-decoration: none; color: inherit;
  }
  .arch .thumb { width: 42px; height: 42px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .arch .thumb img { max-width: 42px; max-height: 42px; }
  .arch .t { font-size: 13.5px; color: var(--text2); line-height: 1.5; min-width: 0; }
  .arch .nw { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arch .win { color: var(--accent); margin-top: 2px; }
  .arch .sprig { right: 8px; bottom: 6px; width: 24px; opacity: .85; }
  .floor { position: relative; height: 112px; margin: 18px -16px 0; }
  .floor .blanket { left: 0; bottom: 0; width: 56%; max-width: 280px; }
  .floor .books { right: 6px; bottom: 4px; width: 34%; max-width: 170px; }
  /* 面板里的房间 */
  .rooms { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
  .room {
    text-decoration: none; color: inherit; display: flex; align-items: center; gap: 12px; padding: 14px 16px;
    border-radius: 16px; background: var(--card); border: 1px solid var(--border);
  }
  .room.mine { border-color: var(--accent-line); }
  .room .name { font-size: 15px; font-weight: 600; }
  .room .meta { font-size: 12px; color: var(--muted); margin-top: 4px; }
  .newroom { margin-top: 18px; padding: 14px; border-radius: 16px; background: var(--card); border: 1px dashed var(--line); }
  /* 开屏：从主屏幕打开时出现，滑动解锁进入大厅 */
  .splash {
    position: fixed; inset: 0; z-index: 100; background: #FAF9F5; color: #141413;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px;
    transition: opacity .45s ease, transform .45s ease;
  }
  .splash.leaving { opacity: 0; transform: scale(1.03); pointer-events: none; }
  .splash .clock { font-size: 76px; font-weight: 600; letter-spacing: 1px; font-variant-numeric: tabular-nums; line-height: 1; }
  .splash .date { font-size: 15px; color: #5E5D59; margin-top: 22px; letter-spacing: 1px; }
  .splash img { width: min(72vw, 300px); image-rendering: pixelated; margin-top: 56px; }
  .splash .home { font-size: 24px; font-weight: 700; margin-top: 48px; }
  .slider {
    position: relative; width: min(84vw, 340px); height: 64px; border-radius: 32px; background: #EEEDE8;
    margin-top: 64px; touch-action: none; user-select: none; -webkit-user-select: none;
  }
  .slider .label { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding-left: 56px; font-size: 14px; color: #8A8984; letter-spacing: 1px; transition: opacity .2s; }
  .slider .knob {
    position: absolute; left: 4px; top: 4px; width: 56px; height: 56px; border-radius: 50%; border: none;
    background: #2F2E2C; color: #FAF9F5; display: flex; align-items: center; justify-content: center; cursor: grab;
  }
  .slider .knob.back { transition: transform .3s ease; }
  @media (prefers-reduced-motion: reduce) { .splash { transition: none; } }
</style>
</head>
<body>
<main class="wrap">
  <div class="hero">
    <img class="deco vine" src="/img/art/vine.webp" alt="">
    <img class="deco lamp" src="/img/art/lamp.webp" alt="">
    <h1 class="serif">今天玩点什么？</h1>
    <p>选一局，等朋友和 AI 来猫窝。</p>
    <img class="art shelfcat" src="/img/art/shelf-cat.webp" alt="">
  </div>

  <div class="games" id="games"></div>

  <section class="arch-wrap">
    <div class="ribbon"><span class="tag">游戏中 <span class="dot live" style="margin-left: 2px;"></span></span><span class="rule"></span></div>
    <div id="live"></div>
  </section>

  <section class="arch-wrap">
    <div class="ribbon"><span class="tag">归档 <span style="color: var(--accent); display: flex;" id="arch-icon"></span></span><span class="rule"></span>
      <a class="more" href="/archive">全部<span id="more-icon" style="display: flex;"></span></a></div>
    <div id="archives"></div>
  </section>

  <div class="floor" aria-hidden="true">
    <img class="deco blanket" src="/img/art/blanket.webp" alt="">
    <img class="deco books" src="/img/art/books.webp" alt="">
  </div>
</main>

<script src="/common.js"></script>
<script>
const { api, esc, icon } = Maowo;
const $ = s => document.querySelector(s);
Maowo.tabbar('games');
$('#arch-icon').innerHTML = icon('archive', 20, 1.6);
$('#more-icon').innerHTML = icon('chevronRight', 16, 2);

const ART = { werewolf: '/img/art/wolf.webp', gomoku: '/img/art/gomoku.webp', uno: '/img/art/uno.webp' };
const WEREWOLF_CONFIGS = {
  6: '2 狼 2 民 · 预言家 女巫', 7: '2 狼 3 民 · 预言家 女巫', 8: '3 狼 3 民 · 预言家 女巫',
  9: '3 狼 3 民 · 预言家 女巫 猎人', 10: '3 狼 4 民 · 预言家 女巫 猎人', 11: '4 狼 4 民 · 预言家 女巫 猎人',
  12: '4 狼 4 民 · 预言家 女巫 猎人 守卫',
  2: '临时测试局 · 1 狼 + 随机 1 个神', // TEMPORARY, remove with the 2-player test table
};
let gamesList = [];
let state = { rooms: [], archives: [] };
let openSheet = null;

const roomStatus = r => r.status === 'waiting' ? '等人中' : '游戏中';

function gameStatus(id) {
  const rooms = state.rooms.filter(r => r.game === id);
  const mine = rooms.find(r => r.mySeat);
  if (mine) return { live: true, mine: true, text: `${mine.name} · ${roomStatus(mine)}` };
  const playing = rooms.filter(r => r.status !== 'waiting').length, waiting = rooms.length - playing;
  if (!rooms.length) return { live: false, text: '空闲中' };
  return { live: true, text: [playing && `${playing} 桌在玩`, waiting && `${waiting} 桌等人`].filter(Boolean).join(' · ') };
}

function renderGames() {
  const chev = `<span class="chev">${icon('chevronRight', 18, 2)}</span>`;
  const cards = gamesList.map(g => {
    const s = gameStatus(g.id);
    return `<button class="game ${s.mine ? 'mine' : ''}" data-game="${g.id}">
      <div class="pic"><img src="${ART[g.id] || '/img/art/toolbox.webp'}" alt=""></div>
      <div class="name">${esc(g.name)}</div>
      <div class="status"><span class="dot ${s.live ? 'live' : ''}"></span><span class="txt">${esc(s.text)}</span>${chev}</div>
    </button>`;
  });
  cards.splice(1, 0, `<div class="game todo"><div class="pic"><img src="/img/art/uno.webp" alt=""></div>
    <div class="name">UNO</div><div class="status"><span class="dot"></span><span class="txt">还在做…</span></div></div>`);
  cards.push(`<div class="game todo"><div class="pic"><img src="/img/art/toolbox.webp" alt=""></div>
    <div class="name">待开发</div><div class="status"><span class="dot"></span><span class="txt">请期待…</span></div></div>`);
  if (!Maowo.setHtml($('#games'), cards.join(''))) return;
  document.querySelectorAll('[data-game]').forEach(b => b.onclick = () => showGame(b.dataset.game));
}

// Every table that is waiting or playing, yours first.
function renderLive() {
  const rooms = [...state.rooms].sort((a, b) => (b.mySeat ? 1 : 0) - (a.mySeat ? 1 : 0));
  Maowo.setHtml($('#live'), rooms.length ? rooms.map(r => `
    <a class="live-room ${r.mySeat ? 'mine' : ''}" href="/room/${r.id}">
      <div class="thumb">${ART[r.game] ? `<img src="${ART[r.game]}" alt="">` : ''}</div>
      <div style="flex-grow: 1; min-width: 0;"><div class="name">${esc(r.name)}</div>
        <div class="meta">${esc(r.gameName)} · ${r.status === 'waiting' ? `等人中 ${r.filled} / ${r.total}` : `${esc(r.phase)}`}</div></div>
      ${r.mySeat ? `<span class="you">你在 ${r.mySeat}号</span>` : ''}
      <span style="color: var(--accent); display: flex;">${icon('chevronRight', 18, 2)}</span>
    </a>`).join('') : '<div class="empty" style="padding: 12px 0;">现在没有在玩的桌。点上面的游戏开一桌吧</div>');
}

function archiveLabel(r) {
  const size = r.total === 2 ? '双人' : `${r.total}人局`;
  // Two whole lines, never broken in the middle: when and what on top, who won below.
  return `<div class="nw">${Maowo.fmtDate(r.finishedAt)} ${Maowo.fmtClock(r.finishedAt)} · ${size}${esc(r.gameName)}</div>
    <div class="nw win">${esc(r.result.title)}</div>`;
}

function renderArchives() {
  const list = state.archives.slice(0, 3);
  Maowo.setHtml($('#archives'), list.length ? list.map(r => `
    <a class="arch" href="/archive/${r.id}">
      <div class="thumb">${ART[r.game] ? `<img src="${ART[r.game]}" alt="">` : ''}</div>
      <div class="t">${archiveLabel(r)}</div>
      <img class="deco sprig" src="/img/art/sprig.webp" alt="">
    </a>`).join('') : '<div class="empty">还没有结束的局</div>');
}

// ---------- one game: its tables and a form for a new one ----------
function showGame(id, keepOpen) {
  const g = gamesList.find(x => x.id === id);
  if (!g) return;
  const rooms = state.rooms.filter(r => r.game === id).sort((a, b) => (b.mySeat ? 1 : 0) - (a.mySeat ? 1 : 0));
  const html = `<h2>${esc(g.name)}</h2>
    <div class="small muted" style="line-height: 1.6;">${esc(g.summary || '')}</div>
    <div class="rooms">${rooms.length ? rooms.map(r => `<a class="room ${r.mySeat ? 'mine' : ''}" href="/room/${r.id}">
        <div style="flex-grow: 1; min-width: 0;"><div class="name">${esc(r.name)}</div>
          <div class="meta">${r.status === 'waiting' ? `等人中 · ${r.filled} / ${r.total} · 房主 ${esc(r.host)}` : `游戏中 · ${esc(r.phase)} · ${r.total} 人`}${r.mySeat ? ` · 你在 ${r.mySeat}号` : ''}</div></div>
        <span style="color: var(--accent); display: flex;">${icon('chevronRight', 18, 2)}</span></a>`).join('')
      : '<div class="empty" style="padding: 16px 0;">现在没有桌子。开一桌，或者让 AI 用 create_room 建一个</div>'}</div>
    <form class="newroom" id="new-form">
      <div style="font-weight: 600; font-size: 15px;">开一桌</div>
      ${id === 'werewolf' ? `<label class="field" for="new-players">人数</label><select id="new-players">${Object.entries(WEREWOLF_CONFIGS).map(([n, l]) =>
        `<option value="${n}" ${n === '9' ? 'selected' : ''}>${n} 人 · ${l}</option>`).join('')}</select>` : ''}
      <label class="field" for="new-name">桌名（可不填）</label><input id="new-name" maxlength="24">
      <button class="btn primary block" type="submit" style="margin-top: 14px;">建好，进去</button>
    </form>`;
  if (openSheet && keepOpen) { openSheet.innerHTML = '<div class="grab"></div>' + html; }
  else { if (openSheet) openSheet.close(); openSheet = Maowo.sheet(html); }
  const panel = openSheet;
  const close = panel.close;
  panel.close = () => { close(); if (openSheet === panel) openSheet = null; };
  panel.querySelector('#new-form').onsubmit = async e => {
    e.preventDefault();
    const players = panel.querySelector('#new-players');
    try {
      const room = await api('/rooms', { json: { game: id, name: panel.querySelector('#new-name').value, options: players ? { players: Number(players.value) } : {} } });
      Maowo.go(`/room/${room.id}`);
    } catch (err) { Maowo.toast(err.message); }
  };
  panel.dataset.game = id;
}

async function load() {
  const [games, rooms, archives] = await Promise.all([api('/games'), api('/rooms'), api('/archives?limit=3')]);
  gamesList = games;
  state = { rooms, archives };
  renderGames(); renderLive(); renderArchives();
}
// ---------- splash ----------
// Only shown with ?splash=1 now. Android already shows its own launch screen (the icon on the
// background color) when the app opens from the home screen, and two in a row felt like a double splash.
function showSplash() {
  const q = new URLSearchParams(location.search);
  if (q.has('app') || q.has('splash')) history.replaceState(null, '', '/');
  if (!q.has('splash')) return;

  const el = document.createElement('div');
  el.className = 'splash';
  el.innerHTML = `<div class="clock" id="sp-clock"></div><div class="date" id="sp-date"></div>
    <img src="/img/home.png" alt="">
    <div class="home">You're home</div>
    <div class="slider" id="sp-slider"><div class="label">slide to unlock</div>
      <button class="knob" id="sp-knob" aria-label="滑动解锁，进入猫窝">${icon('back', 22, 2.4).replace('<path d="M15 18l-6-6 6-6"/>', '<path d="M9 18l6-6-6-6"/>')}</button></div>`;
  document.body.appendChild(el);

  const WEEK = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
  const tick = () => {
    const d = new Date();
    el.querySelector('#sp-clock').textContent = `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    el.querySelector('#sp-date').textContent = `${d.getMonth() + 1}月${d.getDate()}日　${WEEK[d.getDay()]}`;
  };
  tick();
  const timer = setInterval(tick, 1000);

  const slider = el.querySelector('#sp-slider'), knob = el.querySelector('#sp-knob'), label = slider.querySelector('.label');
  let startX = null, x = 0;
  const max = () => slider.clientWidth - knob.clientWidth - 8;
  const unlock = () => {
    clearInterval(timer);
    knob.style.transform = `translateX(${max()}px)`;
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 460);
  };
  knob.addEventListener('pointerdown', e => { startX = e.clientX - x; knob.classList.remove('back'); knob.setPointerCapture(e.pointerId); });
  knob.addEventListener('pointermove', e => {
    if (startX === null) return;
    x = Math.max(0, Math.min(max(), e.clientX - startX));
    knob.style.transform = `translateX(${x}px)`;
    label.style.opacity = String(1 - x / max());
  });
  const release = () => {
    if (startX === null) return;
    startX = null;
    if (x > max() * 0.8) return unlock();
    x = 0; knob.classList.add('back'); knob.style.transform = ''; label.style.opacity = '1';
  };
  knob.addEventListener('pointerup', release);
  knob.addEventListener('pointercancel', release);
  knob.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); unlock(); } });
}
showSplash();

window.maowoRefresh = () => load().catch(() => {});
load().catch(err => Maowo.toast(err.message));
setInterval(() => load().catch(() => {}), 8000);
</script>
</body>
</html>
